<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Chat</title>
<script>try{var _t=localStorage.getItem('theme');if(_t)document.documentElement.dataset.theme=_t}catch(e){}</script>
<style>
  :root{color-scheme:light;--bg:#faf9f5;--panel:#fff;--text:#1f1e1d;--muted:#73726c;--line:#e6e4dd;--accent:#c96442;--user:#efece3;--code:#f1efe8}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#262624;--panel:#30302e;--text:#f0eee6;--muted:#9c9a92;--line:#454541;--accent:#d97757;--user:#3a3a37;--code:#1f1e1d}}
  :root[data-theme=dark]{color-scheme:dark;--bg:#262624;--panel:#30302e;--text:#f0eee6;--muted:#9c9a92;--line:#454541;--accent:#d97757;--user:#3a3a37;--code:#1f1e1d}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  @supports(height:100dvh){html,body{height:100dvh}}
  body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
  header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);padding-top:max(10px,env(safe-area-inset-top))}
  header h1{font-size:16px;margin:0;flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  select,button,input,textarea{font:inherit;color:var(--text)}
  select,.btn{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  .btn{cursor:pointer}
  #msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px}
  .m{max-width:760px;width:100%;margin:0 auto;white-space:pre-wrap;word-wrap:break-word}
  .m.user{background:var(--user);padding:10px 14px;border-radius:14px;width:fit-content;max-width:min(760px,88%);margin-right:auto;margin-left:auto;align-self:center}
  .row{width:100%;max-width:760px;margin:0 auto;display:flex}
  .row.user{justify-content:flex-end}
  .row.user .m{margin:0;background:var(--user);padding:10px 14px;border-radius:14px;max-width:88%;width:auto}
  .row.assistant .m{margin:0}
  pre{background:var(--code);padding:12px;border-radius:10px;overflow-x:auto;white-space:pre;font-size:14px;margin:8px 0}
  code{background:var(--code);padding:1px 5px;border-radius:5px;font-size:.92em}
  pre code{background:none;padding:0}
  .err{color:#c0392b}
  .empty{margin:auto;text-align:center;color:var(--muted)}
  form{display:flex;gap:8px;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
  .wrap{display:flex;gap:8px;max-width:760px;width:100%;margin:0 auto}
  textarea{flex:1;resize:none;max-height:160px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
  textarea:focus,input:focus{border-color:var(--accent)}
  #send{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 18px;cursor:pointer;font-weight:600}
  #send:disabled{opacity:.5}
  dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);width:min(440px,92vw);padding:18px}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  dialog input,dialog textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  small{color:var(--muted)}
  form{flex-direction:column;gap:6px}
  #stats{max-width:760px;width:100%;margin:0 auto;font-size:12px;color:var(--muted);line-height:1.4}
  .row.assistant{flex-direction:column}
  .meta{font-size:12px;color:var(--muted);margin-top:4px}
  #notice,#chips{max-width:760px;width:100%;margin:0 auto;font-size:12px}
  #notice:empty,#chips:empty{display:none}
  .chip{display:inline-block;background:var(--user);border-radius:999px;padding:3px 10px;margin:0 6px 6px 0}
  .chip b{cursor:pointer;margin-left:4px}
  .fchips{font-size:12px;color:var(--muted);margin-top:6px}
  .acts{margin-top:4px;display:flex;gap:6px;align-items:center}
  .acts select,.acts .btn,.cbh button{font-size:12px;padding:2px 8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;cursor:pointer}
  .cb{margin:8px 0}
  .cbh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);background:var(--code);border-radius:10px 10px 0 0;padding:4px 10px;border-bottom:1px solid var(--line)}
  .cbh button{margin-left:6px;color:var(--text)}
  .cb pre{margin:0;border-radius:0 0 10px 10px}
  #stats{display:flex;align-items:center;gap:10px}
  #stats .rb{stroke:var(--accent)} #stats .rn{stroke:var(--muted)} #stats.hot .rb{stroke:#c0392b}
  #stats svg text{fill:var(--text)}
  #side{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);background:var(--panel);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .2s;z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  #side.open{transform:none}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:19;display:none}
  #scrim.open{display:block}
  #side .top{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
  #side .top strong{flex:1}
  #chatList{overflow-y:auto;flex:1;padding:6px}
  .ci{display:flex;align-items:center;gap:2px;padding:8px 10px;border-radius:8px;cursor:pointer}
  .ci:hover{background:var(--bg)} .ci.on{background:var(--user)}
  .ci .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ci button{border:0;background:none;cursor:pointer;opacity:.6;padding:2px 4px}
  .ci button:hover{opacity:1}
  .none{padding:12px;color:var(--muted);font-size:13px}
  #login{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
  .lbox{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px}
  .lbox h2{margin:0 0 4px;font-size:20px}
  .lbox input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
  .lbox #loginBtn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px;font-weight:600;cursor:pointer}
  .lbox #loginBtn:disabled{opacity:.5}
  #loginMsg{font-size:13px;color:#c0392b;min-height:18px}
  #loginTheme{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px}
  .themeBtn{min-width:38px}
  @media (max-width:600px){
    header{gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top))}
    header h1{display:none}
    #model{flex:1;width:auto!important;max-width:none!important;min-width:0}
    #msgs{padding:12px 10px;gap:12px}
    .row.user .m{max-width:94%}
    form{padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
    #stats{font-size:11px}
    pre{font-size:13px}
    dialog{width:94vw;padding:14px}
    .lbox{padding:20px}
  }
  dialog{max-height:90vh;overflow:auto}
  dialog details{margin-top:10px}
  #syncState{padding:8px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);cursor:pointer;word-break:break-all}
  #acctStatus{font-size:13px;margin-bottom:6px}
  #acctMsg{display:block;margin-top:6px}
</style>
</head>
<body>
<header>
  <button class="btn" id="menuBtn" title="Chats">☰</button>
  <h1>Claude Chat</h1>
  <select id="model" class="btn" style="width:170px;max-width:40vw"></select>
  <button class="btn" id="newChat" title="New chat">New</button>
  <button class="btn themeBtn" id="themeBtn" title="Light / dark" type="button">☾</button>
  <button class="btn" id="settingsBtn" title="Settings">⚙︎</button>
</header>

<div id="login">
  <button class="btn themeBtn" id="loginTheme" title="Light / dark" type="button">☾</button>
  <div class="lbox">
    <h2>Claude Chat</h2>
    <small>Sign in to continue.</small>
    <input id="loginEmail" type="email" placeholder="Email" autocomplete="username" autocapitalize="off" spellcheck="false">
    <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" type="button">Sign in</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="scrim"></div>
<aside id="side"><div class="top"><strong>Chats</strong><button class="btn" id="sideNew" type="button">+ New chat</button></div><div id="syncState"></div><div id="chatList"></div></aside>

<div id="msgs"><div class="empty" id="empty">Start a conversation.</div></div>

<form id="form">
  <div id="stats"></div>
  <div id="notice"></div>
  <div id="chips"></div>
  <input type="file" id="file" multiple hidden>
  <div class="wrap">
    <button type="button" class="btn" id="attach" title="Attach files">📎</button>
    <textarea id="input" rows="1" placeholder="Message Claude…"></textarea>
    <button id="send" type="submit">Send</button>
  </div>
</form>

<dialog id="settings">
  <strong>Settings</strong>
  <label for="key">Anthropic API key</label>
  <input id="key" type="password" placeholder="sk-ant-…" autocomplete="off">
  <small>Saved in your account and synced to all your devices. Sent only to the base URL below.</small>
  <label for="baseUrl">Base URL (your provider's endpoint)</label>
  <input id="baseUrl" placeholder="https://cleanapis.com/v1" autocomplete="off">
  <small>Requests go to &lt;base URL&gt;/chat/completions (OpenAI-compatible).</small>
  <label for="system">System prompt (optional)</label>
  <textarea id="system" rows="3" placeholder="You are a helpful assistant."></textarea>
  <label for="maxTokens">Max output tokens</label>
  <input id="maxTokens" type="number" min="256" max="64000" value="4096">
  <label>Cloud sync (chats on all your devices)</label>
  <div id="acctStatus"></div>
  <div class="actions" style="justify-content:flex-start;margin-top:8px">
    <button class="btn" id="signOutBtn" type="button">Sign out</button>
  </div>
  <div class="actions">
    <button class="btn" id="clearKey" type="button">Remove key</button>
    <button class="btn" id="closeSettings" type="button">Save</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
// Only the sign-in session (and the Supabase URL/key) stay in this browser.
// Chats and settings live in memory and in your cloud account.
const LOCAL_KEYS = new Set(['sb_session','sb_owner','theme']);
const CLOUD_KEYS = ['api_key','base_url','system_prompt','max_tokens','model'];
const mem = new Map();
let settingsLoaded = false, settingsTimer = null;
const store = {
  get(k, d=''){ if(LOCAL_KEYS.has(k)){ try{ return localStorage.getItem(k) ?? d }catch{ return d } } return mem.has(k) ? mem.get(k) : d },
  set(k, v){ if(LOCAL_KEYS.has(k)){ try{ localStorage.setItem(k, v); return true }catch{ return false } } mem.set(k, v); if(CLOUD_KEYS.includes(k)) settingsDirty(); return true },
  del(k){ if(LOCAL_KEYS.has(k)){ try{ localStorage.removeItem(k) }catch{} } else { mem.delete(k); if(CLOUD_KEYS.includes(k)) settingsDirty() } }
};
const isLegacyKey = k => k==='chat_history' || k==='chat_index' || k==='current_chat' || k.startsWith('chat:') || CLOUD_KEYS.includes(k);
(function legacyImport(){ // data saved by older versions of this page: upload it once, then delete it
  try{ for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(isLegacyKey(k)) mem.set(k, localStorage.getItem(k)) } }catch{}
})();
function legacyCleanup(){
  try{ const del = []; for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(isLegacyKey(k)) del.push(k) } del.forEach(k=>localStorage.removeItem(k)) }catch{}
}
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let history = [], chats = [], curId = '';
try{ chats = JSON.parse(store.get('chat_index','[]')) }catch{}
try{ // move the old single chat into the new list
  const old = JSON.parse(store.get('chat_history','[]'));
  if(!chats.length && old.length){
    const id = newId(); chats.push({id, title:'Previous chat', updated:Date.now(), auto:true});
    store.set('chat:'+id, JSON.stringify(old)); store.set('chat_index', JSON.stringify(chats)); store.set('current_chat', id);
  }
}catch{}
curId = store.get('current_chat','');
if(!chats.some(c=>c.id===curId)) curId = '';
try{ if(curId) history = JSON.parse(store.get('chat:'+curId,'[]')) }catch{}
let busy = false, controller = null;

$('key').value = store.get('api_key');
$('system').value = store.get('system_prompt');
$('maxTokens').value = store.get('max_tokens','4096');
$('model').value = store.get('model','claude-opus-4.8');
$('baseUrl').value = store.get('base_url','https://cleanapis.com/v1');
const getBase = () => (store.get('base_url','https://cleanapis.com/v1') || 'https://cleanapis.com/v1').trim().replace(/\/+$/,'');
$('model').onchange = e => { store.set('model', e.target.value.trim()); updateStats() };

// [input $/1M, output $/1M, context tokens] from the Models page
const PRICES={
 'gemma-2-2b':[.12,.23,8e3],'deepseek-v4-flash-0731':[.12,.12,1048576],'gpt-5.6-luna':[.36,.36,1.05e6],
 'deepseek-v4-pro-0813':[.55,.55,1048576],'qwen3.8-27b':[.57,.57,262e3],'seed-2.1-turbo':[.92,.92,262e3],
 'seed-2.1-pro':[1.15,1.15,262e3],'kimi-k2.6':[1.22,1.22,1e6],'gemini-3.7-flash':[1.24,1.24,1048576],
 'glm-5.3':[1.36,1.36,1e6],'glm-5.2':[1.36,1.36,1e6],'qwen3.8-max':[1.76,1.76,1e6],'qwen3.7-max':[1.76,1.76,1e6],
 'muse-spark-1.1':[1.82,1.82,1e6],'deepseek-v4-pro-max':[2.05,2.05,1048576],'gemini-3.6-flash':[2.5,2.5,1048576],
 'grok-4.5':[2.81,2.81,5e5],'grok-4.6':[2.81,2.81,5e5],'claude-sonnet-5':[3.32,3.32,1e6],
 'gpt-5.6-terra':[3.58,3.58,1.05e6],'gemini-3.1-pro':[4.47,4.47,1048576],'kimi-k3':[4.98,4.98,1e6],
 'claude-opus-5':[8.3,8.3,1e6],'claude-mythos-preview':[8.3,8.3,1e6],'claude-opus-4.8':[8.3,8.3,1e6],
 'claude-opus-4.6':[8.3,8.3,1e6],'claude-opus-4.7':[8.3,8.3,1e6],'claude-opus-5.5':[8.3,8.3,1e6],
 'gpt-5.6-sol':[8.95,8.95,1.05e6],'gpt-5.5':[8.95,8.95,1.05e6],'gpt-5.5-pro':[8.95,8.95,1.05e6],
 'claude-fable-5':[16.61,16.61,1e6],'claude-fable-5.1':[16.61,16.61,1e6]
};
const MIL=1e6;
function estTok(t){ let a=0,n=0; for(const ch of t||''){ ch.charCodeAt(0)<128 ? a++ : n++ } return Math.ceil(a/4 + n/1.5) }
const fmt = n => n>=1000 ? (n/1000).toFixed(1)+'K' : String(n);
const money = x => x<0.01 ? '$'+x.toFixed(4) : '$'+x.toFixed(3);
function updateStats(){
  const p = PRICES[$('model').value.trim()], ctx = p ? p[2] : 0;
  // start from the real usage of the last reply (prompt + reply), then add what's new
  let idx = -1;
  for(let i=history.length-1;i>=0;i--){ const m = history[i].meta; if(history[i].role==='assistant' && m && m.exact){ idx = i; break } }
  let base = 0;
  if(idx>=0) base = history[idx].meta.tin + history[idx].meta.tout;
  else { const sys = store.get('system_prompt'); base = (sys ? estTok(sys)+4 : 0)+estTok(FILE_HINT)+4 }
  for(let i=idx+1;i<history.length;i++){ const h = history[i]; base += estTok(h.content)+4+(h.images?.length||0)*IMG_TOK }
  let add = 0;
  const draft = $('input').value; if(draft.trim()) add += estTok(draft)+4;
  pending.forEach(f=>{ add += f.kind==='image' ? IMG_TOK : estTok(f.text)+20 });
  const tin = base + add;
  const maxOut = parseInt(store.get('max_tokens','4096'),10) || 4096;
  let t = 'Next request: ~'+fmt(tin)+' tokens in'+(add ? ' (+'+fmt(add)+' new)' : '');
  let ring = '', pc = 0;
  if(p){
    t += ' · ~'+money(tin*p[0]/MIL)+' input · reply up to '+money(maxOut*p[1]/MIL)+' (at max tokens)';
    const C = 2*Math.PI*15, f1 = Math.min(1, base/ctx), f2 = Math.min(1-f1, add/ctx);
    const arc = (f,off,cls)=> f>0 ? '<circle class="'+cls+'" cx="20" cy="20" r="15" fill="none" stroke-width="5" stroke-dasharray="'+Math.max(f*C,1.5)+' '+C+'" stroke-dashoffset="'+(-off*C)+'" transform="rotate(-90 20 20)"/>' : '';
    pc = tin/ctx*100;
    const ps = pc>=100 ? String(Math.round(pc)) : pc>=10 ? pc.toFixed(1) : pc>=1 ? pc.toFixed(2) : pc.toFixed(3);
    const fs = Math.min(9, 24/((ps.length+1)*0.58));
    t += ' · context used '+(pc<1 ? pc.toFixed(4) : pc.toFixed(2))+'% ('+tin.toLocaleString('en-US')+' of '+ctx.toLocaleString('en-US')+')'+(tin>ctx ? ' · ⚠ over the context window' : '');
    ring = '<svg width="58" height="58" viewBox="0 0 40 40" style="flex:none" role="img" aria-label="Context used"><circle cx="20" cy="20" r="15" fill="none" stroke="var(--line)" stroke-width="5"/>'+arc(f1,0,'rb')+arc(f2,f1,'rn')+'<text x="20" y="23.2" text-anchor="middle" font-size="'+fs.toFixed(1)+'">'+ps+'%</text></svg>';
  } else t += ' · no price known for this model';
  const total = history.reduce((a,h)=>a+(h.meta?.cost||0),0);
  if(total) t += '<br>Chat total so far: '+money(total);
  if(saveFail) t += '<br>⚠ Chat is too large to save in this browser; it will be lost on reload.';
  $('stats').className = pc>90 ? 'hot' : '';
  $('stats').innerHTML = ring + '<div>'+t+'</div>';
}
function setMeta(m, meta){
  const row = m.parentNode; row.querySelector('.meta')?.remove();
  const d = document.createElement('div'); d.className = 'meta';
  d.textContent = (meta.exact?'':'~')+fmt(meta.tin)+' in · '+(meta.exact?'':'~')+fmt(meta.tout)+' out'
    + (meta.cost!=null ? ' · '+(meta.exact?'':'~')+money(meta.cost) : '') + (meta.exact?'':' (estimated)');
  row.appendChild(d);
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function render(text){
  const parts = text.split(/```/);
  return parts.map((p,i)=>{
    if(i%2===1){
      const info = ((p.match(/^[^\n]*/)||[''])[0]).trim(), ps = info.split(/\s+/), FN = /^[\w\-./]+\.\w{1,8}$/;
      const lang = (ps[0]||'').replace(/[^\w+#.-]/g,'');
      let name = ps.slice(1).map(x=>x.replace(/["']/g,'')).find(x=>FN.test(x));
      if(!name && FN.test(lang)) name = lang;
      if(!name){ const pv = (parts[i-1]||'').trimEnd().split('\n').pop().match(/^[#*\s`>-]*([\w\-./]+\.\w{1,8})[*:`\s]*$/); if(pv) name = pv[1] }
      name = (name||'').replace(/[^\w\-./]/g,'');
      const body = p.replace(/^[^\n]*\n/,'');
      return '<div class="cb" data-lang="'+lang+'" data-name="'+name+'"><div class="cbh"><span>'+esc(name||lang||'code')+'</span><span><button type="button" data-act="copy">Copy</button><button type="button" data-act="dl">'+(name?'Download':'Save')+'</button></span></div><pre><code>'+esc(body.replace(/\n$/,''))+'</code></pre></div>' }
    return esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  }).join('');
}
function addRow(role, text, meta, files){
  $('empty')?.remove();
  const row = document.createElement('div'); row.className = 'row '+role;
  const m = document.createElement('div'); m.className = 'm';
  m.innerHTML = render(text); row.appendChild(m); $('msgs').appendChild(row);
  if(files&&files.length){ const d = document.createElement('div'); d.className = 'fchips'; d.textContent = '📎 '+files.join(', '); m.appendChild(d) }
  if(meta) setMeta(m, meta);
  if(role==='assistant' && text && text!=='…') addActions(m, text);
  $('msgs').scrollTop = $('msgs').scrollHeight;
  return m;
}
function redraw(){
  $('msgs').innerHTML = '';
  if(!history.length){ $('msgs').innerHTML = '<div class="empty" id="empty">Start a conversation.</div>'; updateStats(); return }
  history.forEach(h => addRow(h.role, h.shown ?? h.content, h.meta, h.files)); updateStats();
}
function save(){
  if(!history.length) return;
  if(!curId){ curId = newId(); chats.unshift({id:curId, title:'New chat', updated:Date.now(), auto:true}) }
  const c = chats.find(x=>x.id===curId); c.updated = Date.now(); delete c.stale;
  if(c.auto!==false){
    const f = history.find(h=>h.role==='user');

async function extractBuffer(name, buf, depth=0){
  const e = extOf(name);
  if(e==='pdf'){
    const pdfjs = await need('pdfjs');
    const pdf = await pdfjs.getDocument({data:new Uint8Array(buf.slice(0))}).promise;
    const out = [];
    for(let i=1;i<=pdf.numPages;i++){
      const c = await (await pdf.getPage(i)).getTextContent();
      out.push('--- page '+i+' ---\n'+c.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('').trim());
    }
    const t = out.join('\n\n');
    return {text:t, warn: t.replace(/--- page \d+ ---|\s/g,'').length<20 ? 'no text found (scanned PDF?)' : ''};
  }
  if(e==='docx'){
    const m = await need('mammoth');
    return {text:(await m.extractRawText({arrayBuffer:buf})).value};
  }
  if(e==='doc') throw new Error('old .doc is not supported, save it as .docx');
  if(['xlsx','xls','xlsm','ods'].includes(e)){
    const X = await need('xlsx'); const wb = X.read(buf,{type:'array'});
    return {text: wb.SheetNames.map(n=>'## Sheet: '+n+'\n'+X.utils.sheet_to_csv(wb.Sheets[n])).join('\n\n')};
  }
  if(e==='zip' && depth===0){
    const Z = await need('jszip'); const zip = await Z.loadAsync(buf);
    const names = Object.keys(zip.files).filter(n=>!zip.files[n].dir).sort();
    const parts = [], skipped = []; let total = 0;
    for(const n of names){
      const x = extOf(n);
      if(SKIP_RE.test(n) || !(TEXT_EXT.has(x) || ['pdf','docx','xlsx','xls'].includes(x))){ skipped.push(n); continue }
      if(total > 1.5e6){ skipped.push(n+' (size cap)'); continue }
      try{
        const r = await extractBuffer(n, await zip.files[n].async('arraybuffer'), 1);
        total += r.text.length; parts.push('### '+n+'\n'+r.text);
      }catch{ skipped.push(n) }
    }
    let text = parts.join('\n\n');
    if(skipped.length) text += '\n\n(Skipped '+skipped.length+' files: '+skipped.slice(0,15).join(', ')+(skipped.length>15?', …':'')+')';
    return {text, warn: skipped.length ? skipped.length+' skipped' : ''};
  }
  if(!TEXT_EXT.has(e) && new Uint8Array(buf.slice(0,4096)).includes(0)) throw new Error('unsupported file type');
  return {text:new TextDecoder().decode(buf)};
}
function imgToDataUrl(f){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onerror = ()=>rej(new Error('read failed'));
    fr.onload = ()=>{
      const url = fr.result, im = new Image();
      im.onerror = ()=>rej(new Error('not a valid image'));
      im.onload = ()=>{
        const sc = Math.min(1, 2000/Math.max(im.width, im.height));
        if(sc===1 && f.size<4e6) return res(url);
        const c = document.createElement('canvas'); c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.88));

}

    if(/^\s*\|/.test(l)){ const r=[]; while(i<L.length && /^\s*\|/.test(L[i])) r.push(L[i++]);
      const t = parseTable(r);
      out.push('<table>'+t.map((row,ri)=>'<tr>'+row.map(c=>'<'+(ri?'td':'th')+' dir="auto">'+inl(c)+'</'+(ri?'td':'th')+'>').join('')+'</tr>').join('')+'</table>'); continue }
    if((m = l.match(/^(#{1,6})\s+(.*)/))){ out.push('<h'+m[1].length+' dir="auto">'+inl(m[2])+'</h'+m[1].length+'>'); i++; continue }

    if(num.test(l)){ const it=[]; while(i<L.length && num.test(L[i])) it.push('<li>'+inl(L[i++].replace(num,''))+'</li>'); out.push('<ol dir="auto">'+it.join('')+'</ol>'); continue }

async function authCall(path, body){
  const r = await fetch(sbUrl()+'/auth/v1/'+path, {method:'POST', headers:{'content-type':'application/json', apikey:sbKey()}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || j.error || String(r.status));
  return j;
}
function takeSession(j){
  if(!j.access_token) return false;
  sbSess = {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Date.now()+(j.expires_in||3600)*1000, email:j.user?.email || sbSess?.email || '', uid:j.user?.id || sbSess?.uid};
  store.set('sb_session', JSON.stringify(sbSess)); return true;
}
async function getToken(){
  if(!sbSess) throw new Error('not signed in');
  if(Date.now() > sbSess.expires_at-60000){
    try{ takeSession(await authCall('token?grant_type=refresh_token', {refresh_token:sbSess.refresh_token})) }
    catch{ sbSess = null; store.del('sb_session'); updateAccountUi(); throw new Error('session expired, sign in again') }
  }
  return sbSess.access_token;
}
async function sbFetch(path, opts={}){
  const tok = await getToken();
  const r = await fetch(sbUrl()+path, {...opts, headers:{apikey:sbKey(), Authorization:'Bearer '+tok, ...(opts.headers||{})}});
  if(!r.ok){ let m = String(r.status); try{ const j = await r.json(); m = j.message || j.error || m }catch{} throw new Error(m) }
  return r;
}

async function pushChat(id){
  const c = chats.find(x=>x.id===id); if(!c || !sbSess) return;
  const raw = store.get('chat:'+id, null); if(raw===null) return;
  await sbFetch('/rest/v1/chats', {method:'POST', headers:{'content-type':'application/json', Prefer:'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify({id, title:c.title, auto:c.auto!==false, messages:JSON.parse(raw), updated_at:new Date(c.updated).toISOString()})});
}
async function pullChat(id){
  const r = await sbFetch('/rest/v1/chats?id=eq.'+encodeURIComponent(id)+'&select=title,auto,messages,updated_at');
  const [x] = await r.json(); if(!x) throw new Error('chat not found in the cloud');
  store.set('chat:'+id, JSON.stringify(x.messages||[]));
  const c = chats.find(y=>y.id===id);
  if(c){ c.title = x.title; c.auto = x.auto; c.updated = msOf(x.updated_at); delete c.stale }
  saveIndex();
}
function cloudPush(){
  if(!sbSess) return;
  clearTimeout(syncTimer); setSync('☁ saving…');
  syncTimer = setTimeout(async ()=>{
    const ids = [...dirty]; dirty.clear();
    try{ for(const id of ids) await pushChat(id); setSync(syncLabel()) }
    catch(e){ ids.forEach(i=>dirty.add(i)); setSync('☁ sync error: '+e.message) }
  }, 1200);
}
async function cloudSync(){
  if(!sbSess || syncBusy) return;
  syncBusy = true; setSync('☁ syncing…');
  try{
    if(!settingsLoaded) await pullSettings();
    const rows = await (await sbFetch('/rest/v1/chats?select=id,title,auto,updated_at&order=updated_at.desc&limit=1000')).json();
    const remote = new Map(rows.map(x=>[x.id,x])); let changed = false;
    for(const x of rows){
      const c = chats.find(y=>y.id===x.id), ru = msOf(x.updated_at);
      if(!c){ chats.push({id:x.id, title:x.title, auto:x.auto, updated:ru, stale:true}); changed = true }
      else if(ru > c.updated+1000){ Object.assign(c, {title:x.title, auto:x.auto, updated:ru, stale:true}); changed = true }
    }
    for(const c of chats){
      const x = remote.get(c.id);
      if(!c.stale && (!x || c.updated > msOf(x.updated_at)+1000) && store.get('chat:'+c.id, null)!==null) await pushChat(c.id);
    }
    if(changed){ saveIndex(); renderChatList() }
    const cur = chats.find(x=>x.id===curId);
    if(cur?.stale && !busy){
      await pullChat(curId);
      try{ history = JSON.parse(store.get('chat:'+curId,'[]')) }catch{ history = [] }
      redraw(); hydrateImages();
    }
    legacyCleanup();
    setSync(syncLabel());
  }catch(e){ setSync('☁ sync error: '+e.message) }
  finally{ syncBusy = false }
}
async function uploadImages(item){
  if(!sbSess || !item.images?.length) return;
  const out = [];
  for(let i=0;i<item.images.length;i++){
    const blob = await (await fetch(item.images[i])).blob();
    const ext = {'image/png':'png','image/webp':'webp','image/gif':'gif'}[blob.type] || 'jpg';
    const path = sbSess.uid+'/'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6)+'-'+i+'.'+ext;
    await sbFetch('/storage/v1/object/chat-images/'+path, {method:'POST', headers:{'content-type':blob.type||'image/jpeg'}, body:blob});
    out.push(path);
  }
  item.imgs = out; save();
}
function hydrateImages(){
  if(!sbSess) return;
  hydrating = (async ()=>{
    for(const h of history){
      if(!h.imgs?.length || h.images?.length) continue;
      try{
        const arr = [];
        for(const p of h.imgs) arr.push(await blobToDataUrl(await (await sbFetch('/storage/v1/object/authenticated/chat-images/'+p)).blob()));
        h.images = arr;
      }catch(e){ flash('Could not load an image: '+e.message) }
    }
    updateStats();
  })();
}

async function send(text){
  if(!sbSess){ updateAccountUi(); return }
  const key = store.get('api_key');
  if(!key){ $('settings').showModal(); return }
  const files = pending.slice(), texts = files.filter(f=>f.kind==='text'), imgs = files.filter(f=>f.kind==='image');
  if(imgs.length && NOVISION.has($('model').value.trim())){ flash('This model has no image input. Remove the image or pick a model marked Vision.'); return }
  pending = []; renderChips();
  let full = texts.map(f=>'[Attached file: '+f.name+']\n~~~\n'+f.text+'\n~~~').join('\n\n');
  if(imgs.length) full += (full?'\n\n':'')+'[Attached image'+(imgs.length>1?'s':'')+': '+imgs.map(f=>f.name).join(', ')+']';
  if(text) full += (full?'\n\n':'')+text;
  busy = true; $('send').disabled = true;
  const item = {role:'user', content:full, shown:text, files:files.map(f=>f.name), images:imgs.map(f=>f.dataUrl)};
  history.push(item); addRow('user', text, null, files.map(f=>f.name));
  uploadImages(item).catch(e=>flash('Image upload failed: '+e.message));
  const out = addRow('assistant', '…');
  let acc = '', usage = null;
  controller = new AbortController();
  try{
    await hydrating;
    const body = {
      model: $('model').value,
      max_tokens: parseInt(store.get('max_tokens','4096'),10) || 4096,
      stream: true,
      stream_options: {include_usage:true},
      messages: history.map(h=>h.images&&h.images.length ? {role:h.role, content:[{type:'text',text:h.content}, ...h.images.map(u=>({type:'image_url',image_url:{url:u}}))]} : {role:h.role, content:h.content})
    };
    const sys = store.get('system_prompt'); body.messages.unshift({role:'system', content: (sys ? sys+'\n\n' : '')+FILE_HINT});
    const estIn = body.messages.reduce((a,m)=>a+4+(typeof m.content==='string' ? estTok(m.content) : m.content.reduce((b,c)=>b+(c.type==='text' ? estTok(c.text) : IMG_TOK),0)),0);
    const doFetch = b => fetch(getBase() + '/chat/completions', {
      method:'POST', signal: controller.signal,
      headers:{
        'content-type':'application/json',
        'Authorization': 'Bearer ' + key
      },
      body: JSON.stringify(b)
    });
    let res = await doFetch(body);
    if(res.status===400){ delete body.stream_options; res = await doFetch(body); }
    if(!res.ok){
      let msg = res.status+' '+res.statusText;
      try{ const j = await res.json(); msg = j.error?.message || msg }catch{}
      throw new Error(msg);
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while(true){
      const {done, value} = await reader.read(); if(done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n'); buf = lines.pop();
      for(const line of lines){
        if(!line.startsWith('data:')) continue;
        const data = line.slice(5).trim(); if(!data || data==='[DONE]') continue;
        let ev; try{ ev = JSON.parse(data) }catch{ continue }
        if(ev.error){ throw new Error(ev.error.message || 'Stream error') }
        if(ev.usage) usage = ev.usage;
        const piece = ev.choices?.[0]?.delta?.content;
        if(piece){
          acc += piece; out.innerHTML = render(acc);
          $('msgs').scrollTop = $('msgs').scrollHeight;
        }
      }
    }
    const p = PRICES[$('model').value.trim()];
    const tin = usage?.prompt_tokens ?? estIn, tout = usage?.completion_tokens ?? estTok(acc);
    const meta = {tin, tout, exact: !!usage, cost: p ? (tin*p[0]+tout*p[1])/MIL : null};
    history.push({role:'assistant', content: acc || '(empty response)', meta}); setMeta(out, meta); addActions(out, acc || '(empty response)'); save();
  }catch(e){
    if(e.name==='AbortError'){ if(acc){ history.push({role:'assistant', content:acc}); save() } }
    else{
      history.pop(); // remove failed user turn so history stays valid
      out.innerHTML = '<span class="err">Error: '+esc(e.message)+'</span>';
    }
  }finally{ busy = false; $('send').disabled = false; controller = null; updateStats() }
}
